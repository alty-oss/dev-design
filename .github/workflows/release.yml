name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - run: npm run verify
      - name: Validate tag and build verified ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package.mjs --output "$RUNNER_TEMP/design-release" --tag "$RELEASE_TAG"
      - name: Publish npm package with trusted publishing
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          npm_dir="$RUNNER_TEMP/design-npm"
          mkdir -p "$npm_dir"
          npm pack --pack-destination "$npm_dir" --json > "$RUNNER_TEMP/design-npm-pack.json"
          archive="$npm_dir/$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/design-npm-pack.json")"
          compare_published_package() {
            registry_dir="$RUNNER_TEMP/design-npm-registry"
            unpacked_dir="$RUNNER_TEMP/design-npm-unpacked"
            rm -rf "$registry_dir" "$unpacked_dir"
            mkdir -p "$registry_dir" "$unpacked_dir/local" "$unpacked_dir/registry"
            npm pack "dev-design@$version" --pack-destination "$registry_dir" --json > "$RUNNER_TEMP/design-npm-registry.json"
            registry_archive="$registry_dir/$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/design-npm-registry.json")"
            tar -xzf "$archive" -C "$unpacked_dir/local"
            tar -xzf "$registry_archive" -C "$unpacked_dir/registry"
            diff --no-dereference -r "$unpacked_dir/local/package" "$unpacked_dir/registry/package"
          }
          view_error="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "dev-design@$version" version > /dev/null 2>"$view_error"; then
            compare_published_package || {
              echo "Refusing npm version collision: dev-design@$version has different extracted bytes." >&2
              exit 1
            }
            echo "dev-design@$version already has the verified extracted files."
          elif rg -q 'E404' "$view_error"; then
            npm publish "$archive" --access public
            compare_published_package || {
              echo "Published npm package differs from the reviewed extracted files." >&2
              exit 1
            }
          else
            cat "$view_error" >&2
            exit 1
          fi
      - name: Publish release and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_label="$RELEASE_TAG"
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            release_label="${RELEASE_TAG%.0}"
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/design-release/"*.zip "$RUNNER_TEMP/design-release/"*.sha256 --verify-tag --title "Dev Design $release_label" --notes-file .github/release-notes.md
